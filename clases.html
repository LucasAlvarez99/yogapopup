<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clases · Yoga Pop Up</title>
  <meta name="description" content="Clases de yoga en vivo con profesores y los videos que compraste, en un solo lugar.">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Tipografías de marca (The Seasons, TT Drugs, Glacial Indifference): @font-face en css/style.css,
       comentado hasta sumar los archivos con licencia en assets/fonts/. Mientras tanto se usan
       las alternativas del propio manual (Georgia, Helvetica Neue, Century Gothic). -->
  <link href="css/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="css/vendor/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
<header id="siteHeader"></header>
<main id="main">
  <section class="page-hero">
    <div class="container-xl">
      <h1>Clases</h1>
      <p>Practicá acompañado en clases en vivo y volvé a ver los videos que compraste.</p>
    </div>
  </section>
  <section class="section pt-0" id="envivo">
    <div class="container-xl">
      <h2 class="yp-block-title">Practicá acompañado</h2>
      <!-- Carrusel de profesores + agenda: js/components/teachers-agenda.js (datos reales de Supabase) -->
      <div id="classesAgenda" aria-live="polite" aria-busy="true"><div class="yp-skeleton"></div></div>
      <noscript><p class="text-muted">Activa JavaScript para ver las clases en vivo.</p></noscript>
    </div>
  </section>
  <section class="section pt-0" id="mis-videos">
    <div class="container-xl">
      <h2 class="yp-block-title">Mis videos</h2>
      <div id="myVideos" aria-live="polite" aria-busy="true"><div class="yp-skeleton"></div></div>
      <noscript><p class="text-muted">Activa JavaScript para ver tus videos.</p></noscript>
    </div>
  </section>
</main>

<footer id="siteFooter"></footer>
<script src="js/vendor/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script type="module" src="js/pages/clases.js"></script>
</body>
</html>
