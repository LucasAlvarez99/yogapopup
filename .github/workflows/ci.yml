name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: ningún job de CI necesita escribir en el repositorio.
permissions:
  contents: read

jobs:
  verify:
    name: Formato, lint, tipos, pruebas y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Dependencias de producción sin vulnerabilidades altas o críticas
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Comprobar que el build lleva las cabeceras de seguridad (CSP)
        run: |
          grep -q "Content-Security-Policy" dist/.htaccess
          for f in dist/*.html; do grep -q 'http-equiv="Content-Security-Policy"' "$f" || { echo "Falta la CSP en $f"; exit 1; }; done
      - name: Comprobar que dist/ no contiene archivos sensibles
        run: |
          ! find dist \( -name ".env*" -o -name "*.sql" -o -name "package*.json" -o -path "dist/supabase" -o -path "dist/supabase/*" -o -path "dist/scripts" -o -path "dist/scripts/*" -o -path "dist/tests" -o -path "dist/tests/*" \) | grep .

  e2e:
    name: E2E en navegador real
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm run test:e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # La misma suite contra el sitio CONSTRUIDO y con la CSP de producción: si algo que la política prohíbe vuelve a
      # colarse (un script o estilo inline, un host no permitido), el navegador lo bloquea y esto falla.
      - name: E2E bajo la CSP de producción
        run: npm run test:e2e:csp
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  db:
    name: Base de datos (migraciones + permisos por rol)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh
